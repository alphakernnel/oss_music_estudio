<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio Pro - Dirección Musical & Repertorio</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --surface-color: #1a1d24;
            --surface-hover: #222630;
            --primary-color: #bb86fc;
            --primary-hover: #9955e8;
            --text-color: #e0e0e0;
            --text-muted: #888888;
            --border-color: #2a2e39;
            
            /* Colores Dinámicos de Criticidad */
            --color-verde-bg: rgba(46, 204, 113, 0.15);
            --color-verde-txt: #2ecc71;
            --color-naranjo-bg: rgba(243, 156, 18, 0.15);
            --color-naranjo-txt: #f39c12;
            --color-rojo-bg: rgba(231, 76, 60, 0.15);
            --color-rojo-txt: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-color);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-title { font-weight: bold; font-size: 18px; letter-spacing: 1px; color: var(--text-color); }
        .badge-sub { background: #2c2f38; color: var(--text-muted); padding: 4px 10px; border-radius: 4px; font-size: 12px; }

        /* Pestañas de Bandas */
        .bands-nav {
            display: flex;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0;
            margin-bottom: 20px;
            align-items: center;
            overflow-x: auto;
        }

        .band-tab {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .band-tab.active { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); }
        .btn-nueva-banda { background: transparent; color: var(--color-verde-txt); border: 1px dashed var(--color-verde-txt); padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; margin-bottom: 10px; }

        /* Panel de Control */
        .band-control-panel {
            background: var(--surface-color);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .band-header-info { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .band-title h1 { margin: 0 0 5px 0; font-size: 24px; color: #fff; }
        .band-subtitle { color: var(--text-muted); font-size: 13px; margin: 0; }
        .band-tools { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }

        .semana-selector {
            background: var(--surface-hover);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .quick-add-bar {
            display: flex;
            gap: 10px;
            background: var(--surface-hover);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .input-cancion-artista {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            padding: 10px 14px;
            font-size: 15px;
        }
        .input-cancion-artista:focus { outline: none; border-color: var(--primary-color); }

        /* Tabla Avanzada */
        .table-container { overflow-x: auto; background: var(--surface-color); border-radius: 8px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        th { background-color: #14171e; color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
        tr:hover { background-color: var(--surface-hover); }

        /* Selectores con Fondos y Colores Dinámicos */
        .table-select {
            border: 1px solid var(--border-color);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .crit-verde { background-color: var(--color-verde-bg) !important; color: var(--color-verde-txt) !important; border-color: rgba(46, 204, 113, 0.3); }
        .crit-naranjo { background-color: var(--color-naranjo-bg) !important; color: var(--color-naranjo-txt) !important; border-color: rgba(243, 156, 18, 0.3); }
        .crit-rojo { background-color: var(--color-rojo-bg) !important; color: var(--color-rojo-txt) !important; border-color: rgba(231, 76, 60, 0.3); }

        /* Visor / Editor flotante de Notas */
        .nota-trigger {
            background: var(--bg-color);
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 4px;
            width: 100%;
            font-size: 12px;
            text-align: left;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nota-trigger:hover { border-color: var(--primary-color); color: var(--text-color); }
        .nota-trigger.tiene-nota { color: var(--color-verde-txt); border-color: rgba(46, 204, 113, 0.4); background: var(--color-verde-bg); }

        /* Círculos de Días */
        .dias-badge-container { display: flex; gap: 4px; }
        .dia-badge {
            width: 24px; height: 24px; border-radius: 50%;
            background-color: var(--bg-color); color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; border: 1px solid var(--border-color);
            cursor: pointer; transition: all 0.2s;
        }
        .dia-badge.activo { background-color: var(--primary-color); color: var(--bg-color); border-color: var(--primary-color); }

        /* Botones de ordenamiento y acciones */
        .order-actions {
            display: flex;
            gap: 4px;
        }
        .btn-order {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            width: 24px;
            height: 24px;
            border-radius: 4px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn-order:hover:not(:disabled) {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .btn-order:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        button { cursor: pointer; font-family: inherit; }
        .btn-primary { background-color: var(--primary-color); color: var(--bg-color); border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; font-size: 14px; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--color-verde-txt); color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 13px; }
        .btn-danger { background-color: transparent; color: var(--color-rojo-txt); border: 1px solid var(--color-rojo-txt); padding: 6px 12px; border-radius: 6px; font-size: 12px; }
        .btn-icon-danger { background: transparent; color: var(--text-muted); border: none; font-size: 16px; cursor: pointer; }
        .btn-icon-danger:hover { color: var(--color-rojo-txt); }

        /* Modales */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.75); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background-color: var(--surface-color); padding: 25px; border-radius: 10px; width: 420px;
            border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .modal-content h3 { margin-top: 0; color: var(--primary-color); }
        .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .checkbox-label { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; }
        .checkbox-label input { accent-color: var(--primary-color); width: 16px; height: 16px; }
        .modal-textarea {
            width: 100%; height: 120px; background: var(--bg-color); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; font-family: inherit; font-size: 14px; margin: 15px 0; resize: vertical;
        }
        .modal-textarea:focus { outline: none; border-color: var(--primary-color); }
    </style>
</head>
<body>

    <div class="header-top">
        <div class="logo-area">
            <span class="logo-title">ESTUDIO PRO</span>
            <span class="badge-sub">Dirección Musical & Repertorio</span>
        </div>
    </div>

    <div class="bands-nav" id="bandsNavContainer"></div>

    <div class="band-control-panel">
        <div class="band-header-info">
            <div class="band-title">
                <h1 id="lblBandName">Cargando...</h1>
                <p class="band-subtitle">Gestión avanzada de ensayos y arreglos</p>
            </div>
            <div class="band-tools">
                <select class="semana-selector">
                    <option>Semana Actual: Ensayos Activos</option>
                </select>
                <button class="btn-success">Finalizar Semana y Enviar a Histórico</button>
                <button class="btn-danger" onclick="eliminarBandaActiva()">Eliminar Banda</button>
            </div>
        </div>

        <div class="quick-add-bar">
            <input type="text" id="inputCancionArtista" class="input-cancion-artista" placeholder="Ej: Born to be My Baby - Bon Jovi">
            <button class="btn-primary" onclick="abrirModalDias()">+ Canción</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 25%;">Canción / Obra (Artista)</th>
                    <th style="width: 8%;">BPM</th>
                    <th style="width: 11%;">Dificultad</th>
                    <th style="width: 10%;">Pistas</th>
                    <th style="width: 11%;">Urgencia</th>
                    <th style="width: 16%;">Notas / Apuntes</th>
                    <th style="width: 10%;">Días</th>
                    <th style="width: 7%;">Mover</th>
                    <th style="width: 4%;">Acción</th>
                </tr>
            </thead>
            <tbody id="tablaRepertorioBody"></tbody>
        </table>
    </div>

    <!-- Modal Días -->
    <div id="modalDias" class="modal-overlay">
        <div class="modal-content">
            <h3>Seleccionar Días de Ensayo</h3>
            <p id="modalCancionPreview" style="font-size: 13px; color: var(--text-muted);"></p>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" value="L" class="chk-dia"> Lunes (L)</label>
                <label class="checkbox-label"><input type="checkbox" value="M" class="chk-dia"> Martes (M)</label>
                <label class="checkbox-label"><input type="checkbox" value="Mi" class="chk-dia"> Miércoles (Mi)</label>
                <label class="checkbox-label"><input type="checkbox" value="J" class="chk-dia"> Jueves (J)</label>
                <label class="checkbox-label"><input type="checkbox" value="V" class="chk-dia"> Viernes (V)</label>
                <label class="checkbox-label"><input type="checkbox" value="S" class="chk-dia"> Sábado (S)</label>
                <label class="checkbox-label"><input type="checkbox" value="D" class="chk-dia"> Domingo (D)</label>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn-primary" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border-color);" onclick="cerrarModalDias()">Cancelar</button>
                <button class="btn-primary" onclick="guardarNuevaCancionConDias()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Popup Flotante para Notas -->
    <div id="modalNotas" class="modal-overlay">
        <div class="modal-content" style="width: 480px;">
            <h3>Editor de Notas y Apuntes</h3>
            <p id="modalNotasTitulo" style="font-size: 13px; color: var(--text-muted);"></p>
            <textarea id="txtNotaPopup" class="modal-textarea" placeholder="Escribe detalles de arreglos, estructura, solos o indicaciones de dirección musical..."></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn-primary" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border-color);" onclick="cerrarModalNotas()">Cancelar</button>
                <button class="btn-primary" onclick="guardarNotaPopup()">Guardar Nota</button>
            </div>
        </div>
    </div>

<script>
    let datosApp = JSON.parse(localStorage.getItem('estudio_pro_data')) || {
        bandaActiva: 0,
        bandas: [
            {
                nombre: "GLAMLEGACY",
                canciones: [
                    { texto: "Born to be My Baby - Bon Jovi", bpm: 120, dificultad: "Media", pistas: "No", urgencia: "Alta", nota: "Revisar puente y entrada del solo de guitarra.", dias: ["L", "M", "V"] }
                ]
            }
        ]
    };

    const diasSemana = ['L', 'M', 'Mi', 'J', 'V', 'S', 'D'];
    let indiceCancionEditandoNota = null;

    function guardarEstado() {
        localStorage.setItem('estudio_pro_data', JSON.stringify(datosApp));
    }

    function obtenerClaseDificultad(val) {
        if (val === 'Baja') return 'crit-verde';
        if (val === 'Media') return 'crit-naranjo';
        if (val === 'Alta') return 'crit-rojo';
        return '';
    }

    function obtenerClaseUrgencia(val) {
        if (val === 'Baja') return 'crit-verde';
        if (val === 'Media') return 'crit-naranjo';
        if (val === 'Alta') return 'crit-rojo';
        return '';
    }

    function obtenerClasePistas(val) {
        if (val === 'No') return 'crit-verde';
        if (val === 'Sí') return 'crit-rojo';
        return '';
    }

    function renderizarApp() {
        renderizarPestañasBandas();
        renderizarPanelBandaActiva();
    }

    function renderizarPestañasBandas() {
        const nav = document.getElementById('bandsNavContainer');
        nav.innerHTML = '';
        datosApp.bandas.forEach((banda, idx) => {
            const btn = document.createElement('button');
            btn.className = `band-tab ${idx === datosApp.bandaActiva ? 'active' : ''}`;
            btn.innerText = banda.nombre;
            btn.onclick = () => { datosApp.bandaActiva = idx; guardarEstado(); renderizarApp(); };
            nav.appendChild(btn);
        });
        const btnNueva = document.createElement('button');
        btnNueva.className = 'btn-nueva-banda';
        btnNueva.innerText = '+ Nueva Banda';
        btnNueva.onclick = crearNuevaBanda;
        nav.appendChild(btnNueva);
    }

    function renderizarPanelBandaActiva() {
        const banda = datosApp.bandas[datosApp.bandaActiva];
        if (!banda) return;
        document.getElementById('lblBandName').innerText = banda.nombre;

        const tbody = document.getElementById('tablaRepertorioBody');
        tbody.innerHTML = '';

        if (banda.canciones.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; color: var(--text-muted); padding: 25px;">No hay canciones en este repertorio.</td></tr>`;
            return;
        }

        banda.canciones.forEach((cancion, index) => {
            let badgesHtml = '<div class="dias-badge-container">';
            diasSemana.forEach(dia => {
                const activo = cancion.dias && cancion.dias.includes(dia) ? 'activo' : '';
                badgesHtml += `<div class="dia-badge ${activo}" title="${dia}" onclick="toggleDiaCancion(${index}, '${dia}')">${dia}</div>`;
            });
            badgesHtml += '</div>';

            let textoNotaVisual = cancion.nota ? cancion.nota : "Hacer clic para agregar nota...";
            let claseNotaVisual = cancion.nota ? "nota-trigger tiene-nota" : "nota-trigger";

            // Botones de ordenamiento (Subir / Bajar)
            const deshabilitarSubir = index === 0 ? 'disabled' : '';
            const deshabilitarBajar = index === banda.canciones.length - 1 ? 'disabled' : '';
            
            let orderActionsHtml = `
                <div class="order-actions">
                    <button class="btn-order" ${deshabilitarSubir} onclick="moverCancion(${index}, -1)" title="Mover arriba">▲</button>
                    <button class="btn-order" ${deshabilitarBajar} onclick="moverCancion(${index}, 1)" title="Mover abajo">▼</button>
                </div>
            `;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 500; color: #fff;">${cancion.texto}</td>
                <td><input type="number" class="table-select" style="width: 60px; background: var(--bg-color); color: var(--text-color);" value="${cancion.bpm}" onchange="actualizarDato(${index}, 'bpm', this.value)"></td>
                <td>
                    <select class="table-select ${obtenerClaseDificultad(cancion.dificultad)}" onchange="actualizarDato(${index}, 'dificultad', this.value); renderizarPanelBandaActiva();">
                        <option value="Baja" ${cancion.dificultad==='Baja'?'selected':''}>Baja</option>
                        <option value="Media" ${cancion.dificultad==='Media'?'selected':''}>Media</option>
                        <option value="Alta" ${cancion.dificultad==='Alta'?'selected':''}>Alta</option>
                    </select>
                </td>
                <td>
                    <select class="table-select ${obtenerClasePistas(cancion.pistas)}" onchange="actualizarDato(${index}, 'pistas', this.value); renderizarPanelBandaActiva();">
                        <option value="No" ${cancion.pistas==='No'?'selected':''}>No</option>
                        <option value="Sí" ${cancion.pistas==='Sí'?'selected':''}>Sí</option>
                    </select>
                </td>
                <td>
                    <select class="table-select ${obtenerClaseUrgencia(cancion.urgencia)}" onchange="actualizarDato(${index}, 'urgencia', this.value); renderizarPanelBandaActiva();">
                        <option value="Baja" ${cancion.urgencia==='Baja'?'selected':''}>Baja</option>
                        <option value="Media" ${cancion.urgencia==='Media'?'selected':''}>Media</option>
                        <option value="Alta" ${cancion.urgencia==='Alta'?'selected':''}>Alta</option>
                    </select>
                </td>
                <td><button class="${claseNotaVisual}" onclick="abrirModalNotas(${index})" title="${cancion.nota || ''}">${textoNotaVisual}</button></td>
                <td>${badgesHtml}</td>
                <td>${orderActionsHtml}</td>
                <td><button class="btn-icon-danger" onclick="eliminarCancion(${index})">&times;</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Función para mover canciones arriba o abajo en el array y persistir
    function moverCancion(index, direccion) {
        const banda = datosApp.bandas[datosApp.bandaActiva];
        const nuevoIndex = index + direccion;

        if (nuevoIndex < 0 || nuevoIndex >= banda.canciones.length) return;

        // Intercambiar elementos en el array
        const temp = banda.canciones[index];
        banda.canciones[index] = banda.canciones[nuevoIndex];
        banda.canciones[nuevoIndex] = temp;

        guardarEstado();
        renderizarPanelBandaActiva();
    }

    function abrirModalDias() {
        const input = document.getElementById('inputCancionArtista');
        if (!input.value.trim()) { alert("Ingresa canción y artista."); return; }
        document.getElementById('modalCancionPreview').innerText = `Obra: "${input.value.trim()}"`;
        document.querySelectorAll('.chk-dia').forEach(chk => chk.checked = false);
        document.getElementById('modalDias').style.display = 'flex';
    }

    function cerrarModalDias() { document.getElementById('modalDias').style.display = 'none'; }

    function guardarNuevaCancionConDias() {
        const input = document.getElementById('inputCancionArtista');
        const diasSeleccionados = [];
        document.querySelectorAll('.chk-dia:checked').forEach(chk => diasSeleccionados.push(chk.value));

        datosApp.bandas[datosApp.bandaActiva].canciones.push({
            texto: input.value.trim(),
            bpm: 120,
            dificultad: "Media",
            pistas: "No",
            urgencia: "Media",
            nota: "",
            dias: diasSeleccionados
        });
        guardarEstado();
        input.value = '';
        cerrarModalDias();
        renderizarPanelBandaActiva();
    }

    function abrirModalNotas(index) {
        indiceCancionEditandoNota = index;
        const cancion = datosApp.bandas[datosApp.bandaActiva].canciones[index];
        document.getElementById('modalNotasTitulo').innerText = `Obra: ${cancion.texto}`;
        document.getElementById('txtNotaPopup').value = cancion.nota || '';
        document.getElementById('modalNotas').style.display = 'flex';
    }

    function cerrarModalNotas() {
        document.getElementById('modalNotas').style.display = 'none';
        indiceCancionEditandoNota = null;
    }

    function guardarNotaPopup() {
        if (indiceCancionEditandoNota !== null) {
            datosApp.bandas[datosApp.bandaActiva].canciones[indiceCancionEditandoNota].nota = document.getElementById('txtNotaPopup').value.trim();
            guardarEstado();
            renderizarPanelBandaActiva();
        }
        cerrarModalNotas();
    }

    function actualizarDato(index, campo, valor) {
        datosApp.bandas[datosApp.bandaActiva].canciones[index][campo] = valor;
        guardarEstado();
    }

    function toggleDiaCancion(indexCancion, dia) {
        let dias = datosApp.bandas[datosApp.bandaActiva].canciones[indexCancion].dias || [];
        const pos = dias.indexOf(dia);
        if (pos > -1) dias.splice(pos, 1);
        else dias.push(dia);
        guardarEstado();
        renderizarPanelBandaActiva();
    }

    function eliminarCancion(index) {
        if (confirm("¿Eliminar esta canción?")) {
            datosApp.bandas[datosApp.bandaActiva].canciones.splice(index, 1);
            guardarEstado();
            renderizarPanelBandaActiva();
        }
    }

    function crearNuevaBanda() {
        const nombre = prompt("Nombre de la nueva banda:");
        if (nombre && nombre.trim() !== "") {
            datosApp.bandas.push({ nombre: nombre.trim().toUpperCase(), canciones: [] });
            datosApp.bandaActiva = datosApp.bandas.length - 1;
            guardarEstado();
            renderizarApp();
        }
    }

    function eliminarBandaActiva() {
        if (datosApp.bandas.length <= 1) { alert("Debe haber al menos una banda."); return; }
        if (confirm("¿Estás seguro de eliminar esta banda?")) {
            datosApp.bandas.splice(datosApp.bandaActiva, 1);
            datosApp.bandaActiva = 0;
            guardarEstado();
            renderizarApp();
        }
    }

    renderizarApp();
</script>
</body>
</html>
