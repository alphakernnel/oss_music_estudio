<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estudio Pro - Dirección Musical & Repertorio</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --surface-color: #1a1d24;
            --surface-hover: #222630;
            --primary-color: #bb86fc;
            --primary-hover: #9955e8;
            --text-color: #e0e0e0;
            --text-muted: #888888;
            --border-color: #2a2e39;
            
            --color-verde-bg: rgba(46, 204, 113, 0.15);
            --color-verde-txt: #2ecc71;
            --color-naranjo-bg: rgba(243, 156, 18, 0.15);
            --color-naranjo-txt: #f39c12;
            --color-rojo-bg: rgba(231, 76, 60, 0.15);
            --color-rojo-txt: #e74c3c;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            -webkit-user-select: none;
            user-select: none;
        }

        @media (min-width: 768px) { body { padding: 20px; } }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-color);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-title { font-weight: bold; font-size: 16px; letter-spacing: 1px; color: var(--text-color); }
        .badge-sub { background: #2c2f38; color: var(--text-muted); padding: 4px 8px; border-radius: 4px; font-size: 11px; }

        .status-sync {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(46, 204, 113, 0.1);
            color: var(--color-verde-txt);
            border: 1px solid rgba(46, 204, 113, 0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .bands-nav {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .bands-nav::-webkit-scrollbar { height: 4px; }
        .bands-nav::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

        .band-tab {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }
        .band-tab.active { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); }
        .btn-nueva-banda { background: transparent; color: var(--color-verde-txt); border: 1px dashed var(--color-verde-txt); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; white-space: nowrap; }

        .band-control-panel {
            background: var(--surface-color);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .band-header-info { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;}
        .band-title h1 { margin: 0 0 3px 0; font-size: 20px; color: #fff; word-break: break-word; }
        .band-subtitle { color: var(--text-muted); font-size: 12px; margin: 0; }
        .band-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .quick-add-bar {
            display: flex;
            gap: 8px;
            background: var(--surface-hover);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            flex-direction: column;
        }
        @media (min-width: 576px) { .quick-add-bar { flex-direction: row; } }

        .input-cancion-artista {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            padding: 10px 12px;
            font-size: 14px;
            width: 100%;
        }
        .input-cancion-artista:focus { outline: none; border-color: var(--primary-color); }

        .table-container { 
            overflow-x: auto; 
            background: var(--surface-color); 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            -webkit-overflow-scrolling: touch;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; min-width: 780px; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        th { background-color: #14171e; color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        tr:hover { background-color: var(--surface-hover); }

        .table-select {
            border: 1px solid var(--border-color);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            background: var(--bg-color);
            color: var(--text-color);
        }
        .table-select:disabled { opacity: 0.7; cursor: default; }

        .crit-verde { background-color: var(--color-verde-bg) !important; color: var(--color-verde-txt) !important; border-color: rgba(46, 204, 113, 0.3); }
        .crit-naranjo { background-color: var(--color-naranjo-bg) !important; color: var(--color-naranjo-txt) !important; border-color: rgba(243, 156, 18, 0.3); }
        .crit-rojo { background-color: var(--color-rojo-bg) !important; color: var(--color-rojo-txt) !important; border-color: rgba(231, 76, 60, 0.3); }

        .nota-trigger {
            background: var(--bg-color);
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 4px;
            width: 100%;
            font-size: 11px;
            text-align: left;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }
        .nota-trigger:hover { border-color: var(--primary-color); color: var(--text-color); }
        .nota-trigger.tiene-nota { color: var(--color-verde-txt); border-color: rgba(46, 204, 113, 0.4); background: var(--color-verde-bg); }

        .dias-badge-container { display: flex; gap: 4px; }
        .dia-badge {
            width: 24px; height: 24px; border-radius: 50%;
            background-color: var(--bg-color); color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }
        .dia-badge.activo { background-color: var(--primary-color); color: var(--bg-color); border-color: var(--primary-color); }
        .dia-badge.bloqueado { cursor: default; opacity: 0.8; }

        .order-actions { display: flex; gap: 4px; }
        .btn-order {
            background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color);
            width: 26px; height: 26px; border-radius: 4px; font-size: 11px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .btn-order:disabled { opacity: 0.3; cursor: not-allowed; }

        button { cursor: pointer; font-family: inherit; }
        .btn-primary { background-color: var(--primary-color); color: var(--bg-color); border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 12px; white-space: nowrap; }
        .btn-save-manual { background-color: var(--color-verde-txt); color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        .btn-edit-mode { background: transparent; color: var(--primary-color); border: 1px solid var(--primary-color); padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 12px; }
        .btn-edit-mode.active { background: var(--primary-color); color: var(--bg-color); }
        .btn-danger { background-color: transparent; color: var(--color-rojo-txt); border: 1px solid var(--color-rojo-txt); padding: 8px 12px; border-radius: 6px; font-size: 12px; }
        .btn-icon-danger { background: transparent; color: var(--text-muted); border: none; font-size: 16px; cursor: pointer; padding: 4px 8px; }
        .btn-icon-danger:hover { color: var(--color-rojo-txt); }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.75); justify-content: center; align-items: center; z-index: 1000; padding: 15px; box-sizing: border-box;
        }
        .modal-content {
            background-color: var(--surface-color); padding: 20px; border-radius: 10px; width: 100%; max-width: 400px;
            border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .modal-content h3 { margin-top: 0; color: var(--primary-color); font-size: 18px; }
        .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin: 15px 0; }
        .checkbox-label { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; }
        .checkbox-label input { accent-color: var(--primary-color); width: 18px; height: 18px; }
        .modal-textarea {
            width: 100%; height: 120px; background: var(--bg-color); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; font-family: inherit; font-size: 13px; margin: 12px 0; resize: vertical; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <div class="logo-area">
            <span class="logo-title">ESTUDIO PRO</span>
            <span class="badge-sub">Repertorio Maestro</span>
        </div>
        <div class="status-sync" id="statusSyncIndicator">
            <span>●</span> Sincronizado
        </div>
    </div>

    <div class="bands-nav" id="bandsNavContainer"></div>

    <div class="band-control-panel">
        <div class="band-header-info">
            <div class="band-title">
                <h1 id="lblBandName">Cargando...</h1>
                <p class="band-subtitle">Dirección Musical & Repertorio</p>
            </div>
            <div class="band-tools">
                <button class="btn-edit-mode" id="btnToggleEdit" onclick="toggleModoEdicion()">Modo Edición: OFF</button>
                <button class="btn-save-manual" onclick="forzarGuardadoManual()">💾 Guardar Cambios</button>
                <button class="btn-danger" onclick="eliminarBandaActiva()">Eliminar Banda</button>
            </div>
        </div>

        <div class="quick-add-bar" id="quickAddBarContainer" style="display:none;">
            <input type="text" id="inputCancionArtista" class="input-cancion-artista" placeholder="Ej: Canción - Artista">
            <button class="btn-primary" onclick="abrirModalDias()">+ Canción</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 25%;">Canción / Obra</th>
                    <th style="width: 8%;">BPM</th>
                    <th style="width: 11%;">Dificultad</th>
                    <th style="width: 10%;">Pistas</th>
                    <th style="width: 11%;">Urgencia</th>
                    <th style="width: 16%;">Notas</th>
                    <th style="width: 10%;">Días</th>
                    <th style="width: 7%;" class="col-edicion-extra">Mover</th>
                    <th style="width: 4%;" class="col-edicion-extra">Acción</th>
                </tr>
            </thead>
            <tbody id="tablaRepertorioBody"></tbody>
        </table>
    </div>

    <!-- Modal Días -->
    <div id="modalDias" class="modal-overlay">
        <div class="modal-content">
            <h3>Seleccionar Días de Ensayo</h3>
            <p id="modalCancionPreview" style="font-size: 12px; color: var(--text-muted);"></p>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" value="L" class="chk-dia"> Lunes (L)</label>
                <label class="checkbox-label"><input type="checkbox" value="M" class="chk-dia"> Martes (M)</label>
                <label class="checkbox-label"><input type="checkbox" value="Mi" class="chk-dia"> Miércoles (Mi)</label>
                <label class="checkbox-label"><input type="checkbox" value="J" class="chk-dia"> Jueves (J)</label>
                <label class="checkbox-label"><input type="checkbox" value="V" class="chk-dia"> Viernes (V)</label>
                <label class="checkbox-label"><input type="checkbox" value="S" class="chk-dia"> Sábado (S)</label>
                <label class="checkbox-label"><input type="checkbox" value="D" class="chk-dia"> Domingo (D)</label>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button class="btn-primary" style="background:transparent; color:var(--text-muted); border:1px solid var(--border-color);" onclick="cerrarModalDias()">Cancelar</button>
                <button class="btn-primary" onclick="guardarNuevaCancionConDias()">Añadir Obra</button>
            </div>
        </div>
    </div>

    <!-- Modal Notas -->
    <div id="modalNotas" class="modal-overlay">
        <div class="modal-content">
            <h3>Editor de Arreglos / Notas</h3>
            <p id="modalNotasTitulo" style="font-size: 12px; color: var(--text-muted);"></p>
            <textarea id="txtNotaPopup" class="modal-textarea" placeholder="Escribe notas de dirección, cambios de estructura..."></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button class="btn-primary" style="background:transparent; color:var(--text-muted); border:1px solid var(--border-color);" onclick="cerrarModalNotas()">Cancelar</button>
                <button class="btn-primary" onclick="guardarNotaPopup()">Guardar Nota</button>
            </div>
        </div>
    </div>

<script>
    // 1. Credenciales y configuración de GitHub
    const GITHUB_TOKEN = 'TU_TOKEN_AQUI'; 
    const REPO_OWNER = 'TU_USUARIO_DE_GITHUB'; 
    const REPO_NAME = 'NOMBRE_DE_TU_REPOSITORIO'; 
    const BRANCH = 'main';

    // 2. Función que envía los datos a GitHub (API REST)
    async function guardarCancionEnGitHub(cancion) {
        const path = `data/canciones/${cancion.id}.json`;
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;
        
        const contenidoBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(cancion, null, 2))));
        
        let sha = null;
        const responseCheck = await fetch(url, {
            headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
        });
        
        if (responseCheck.ok) {
            const dataFile = await responseCheck.json();
            sha = dataFile.sha;
        }

        const bodyData = {
            message: `Crea o actualiza canción: ${cancion.titulo}`,
            content: contenidoBase64,
            branch: BRANCH
        };
        
        if (sha) bodyData.sha = sha;

        const response = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(bodyData)
        });

        if (!response.ok) {
            throw new Error(`Error al guardar en GitHub: ${response.statusText}`);
        }

        return await response.json();
    }

    let datosApp = {
        bandaActiva: 0,
        bandas: [
            {
                nombre: "GLAMLEGACY",
                canciones: [
                    { texto: "Born to be My Baby - Bon Jovi", bpm: 120, dificultad: "Media", pistas: "No", urgencia: "Alta", nota: "Revisar puente y solo.", dias: ["L", "M", "V"] }
                ]
            }
        ]
    };

    let modoEdicionActivo = false;
    const diasSemana = ['L', 'M', 'Mi', 'J', 'V', 'S', 'D'];
    let indiceCancionEditandoNota = null;

    function cargarEstado() {
        const local = localStorage.getItem('estudio_pro_data');
        if (local) {
            try {
                datosApp = JSON.parse(local);
            } catch (e) {
                console.error("Error al cargar localStorage", e);
            }
        }
        renderizarApp();
    }

    function guardarEstadoAutomatico() {
        localStorage.setItem('estudio_pro_data', JSON.stringify(datosApp));
        actualizarIndicadorSync("Sincronizado", "verde");
    }

    window.forzarGuardadoManual = function() {
        localStorage.setItem('estudio_pro_data', JSON.stringify(datosApp));
        actualizarIndicadorSync("¡Guardado Exitoso!", "verde");
        alert("¡Datos guardados correctamente en la memoria del navegador!");
    }

    function actualizarIndicadorSync(texto, estado) {
        const ind = document.getElementById('statusSyncIndicator');
        if (estado === "verde") {
            ind.style.background = "rgba(46, 204, 113, 0.1)";
            ind.style.color = "var(--color-verde-txt)";
            ind.style.borderColor = "rgba(46, 204, 113, 0.3)";
            ind.innerHTML = `<span>●</span> ${texto}`;
        }
    }

    window.toggleModoEdicion = function() {
        modoEdicionActivo = !modoEdicionActivo;
        const btn = document.getElementById('btnToggleEdit');
        const quickAdd = document.getElementById('quickAddBarContainer');
        
        if (modoEdicionActivo) {
            btn.classList.add('active');
            btn.innerText = "Modo Edición: ON";
            quickAdd.style.display = "flex";
        } else {
            btn.classList.remove('active');
            btn.innerText = "Modo Edición: OFF";
            quickAdd.style.display = "none";
        }
        renderizarApp();
    }

    function obtenerClaseDificultad(val) {
        if (val === 'Baja') return 'crit-verde';
        if (val === 'Media') return 'crit-naranjo';
        if (val === 'Alta') return 'crit-rojo';
        return '';
    }

    function obtenerClaseUrgencia(val) { return obtenerClaseDificultad(val); }
    function obtenerClasePistas(val) {
        if (val === 'No') return 'crit-verde';
        if (val === 'Sí') return 'crit-rojo';
        return '';
    }

    window.renderizarApp = function() {
        renderizarPestañasBandas();
        renderizarPanelBandaActiva();
    }

    function renderizarPestañasBandas() {
        const nav = document.getElementById('bandsNavContainer');
        nav.innerHTML = '';
        datosApp.bandas.forEach((banda, idx) => {
            const btn = document.createElement('button');
            btn.className = `band-tab ${idx === datosApp.bandaActiva ? 'active' : ''}`;
            btn.innerText = banda.nombre;
            btn.onclick = () => { datosApp.bandaActiva = idx; guardarEstadoAutomatico(); renderizarApp(); };
            nav.appendChild(btn);
        });
        const btnNueva = document.createElement('button');
        btnNueva.className = 'btn-nueva-banda';
        btnNueva.innerText = '+ Banda';
        btnNueva.onclick = crearNuevaBanda;
        nav.appendChild(btnNueva);
    }

    function renderizarPanelBandaActiva() {
        const banda = datosApp.bandas[datosApp.bandaActiva];
        if (!banda) return;
        document.getElementById('lblBandName').innerText = banda.nombre;

        document.querySelectorAll('.col-edicion-extra').forEach(col => {
            col.style.display = modoEdicionActivo ? '' : 'none';
        });

        const tbody = document.getElementById('tablaRepertorioBody');
        tbody.innerHTML = '';

        if (banda.canciones.length === 0) {
            let colspanVal = modoEdicionActivo ? 9 : 7;
            tbody.innerHTML = `<tr><td colspan="${colspanVal}" style="text-align:center; color: var(--text-muted); padding: 25px;">Sin canciones registradas. Activa el "Modo Edición: ON" para añadir temas.</td></tr>`;
            return;
        }

        banda.canciones.forEach((cancion, index) => {
            let badgesHtml = '<div class="dias-badge-container">';
            diasSemana.forEach(dia => {
                const activo = cancion.dias && cancion.dias.includes(dia) ? 'activo' : '';
                const clickAttr = modoEdicionActivo ? `onclick="window.toggleDiaCancion(${index}, '${dia}')"` : '';
                const claseBloqueo = modoEdicionActivo ? '' : 'bloqueado';
                badgesHtml += `<div class="dia-badge ${activo} ${claseBloqueo}" ${clickAttr}>${dia}</div>`;
            });
            badgesHtml += '</div>';

            let textoNotaVisual = cancion.nota ? cancion.nota : (modoEdicionActivo ? "Agregar nota..." : "Sin notas");
            let claseNotaVisual = cancion.nota ? "nota-trigger tiene-nota" : "nota-trigger";

            const deshabilitarCampos = modoEdicionActivo ? '' : 'disabled';

            const deshabilitarSubir = index === 0 ? 'disabled' : '';
            const deshabilitarBajar = index === banda.canciones.length - 1 ? 'disabled' : '';
            
            let orderActionsHtml = modoEdicionActivo ? `
                <div class="order-actions">
                    <button class="btn-order" ${deshabilitarSubir} onclick="window.moverCancion(${index}, -1)">▲</button>
                    <button class="btn-order" ${deshabilitarBajar} onclick="window.moverCancion(${index}, 1)">▼</button>
                </div>
            ` : '';

            let accionBorrarHtml = modoEdicionActivo ? `<button class="btn-icon-danger" onclick="window.eliminarCancion(${index})">&times;</button>` : '';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 500; color: #fff;">${cancion.texto}</td>
                <td><input type="number" class="table-select" style="width: 55px;" value="${cancion.bpm}" ${deshabilitarCampos} onchange="window.actualizarDato(${index}, 'bpm', this.value)"></td>
                <td>
                    <select class="table-select ${obtenerClaseDificultad(cancion.dificultad)}" ${deshabilitarCampos} onchange="window.actualizarDato(${index}, 'dificultad', this.value); window.renderizarApp();">
                        <option value="Baja" ${cancion.dificultad==='Baja'?'selected':''}>Baja</option>
                        <option value="Media" ${cancion.dificultad==='Media'?'selected':''}>Media</option>
                        <option value="Alta" ${cancion.dificultad==='Alta'?'selected':''}>Alta</option>
                    </select>
                </td>
                <td>
                    <select class="table-select ${obtenerClasePistas(cancion.pistas)}" ${deshabilitarCampos} onchange="window.actualizarDato(${index}, 'pistas', this.value); window.renderizarApp();">
                        <option value="No" ${cancion.pistas==='No'?'selected':''}>No</option>
                        <option value="Sí" ${cancion.pistas==='Sí'?'selected':''}>Sí</option>
                    </select>
                </td>
                <td>
                    <select class="table-select ${obtenerClaseUrgencia(cancion.urgencia)}" ${deshabilitarCampos} onchange="window.actualizarDato(${index}, 'urgencia', this.value); window.renderizarApp();">
                        <option value="Baja" ${cancion.urgencia==='Baja'?'selected':''}>Baja</option>
                        <option value="Media" ${cancion.urgencia==='Media'?'selected':''}>Media</option>
                        <option value="Alta" ${cancion.urgencia==='Alta'?'selected':''}>Alta</option>
                    </select>
                </td>
                <td><button class="${claseNotaVisual}" onclick="window.abrirModalNotas(${index})">${textoNotaVisual}</button></td>
                <td>${badgesHtml}</td>
                <td class="col-edicion-extra">${orderActionsHtml}</td>
                <td class="col-edicion-extra">${accionBorrarHtml}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.moverCancion = function(index, direccion) {
        if (!modoEdicionActivo) return;
        const banda = datosApp.bandas[datosApp.bandaActiva];
        const nuevoIndex = index + direccion;
        if (nuevoIndex < 0 || nuevoIndex >= banda.canciones.length) return;
        const temp = banda.canciones[index];
        banda.canciones[index] = banda.canciones[nuevoIndex];
        banda.canciones[nuevoIndex] = temp;
        guardarEstadoAutomatico();
        renderizarApp();
    }

    window.abrirModalDias = function() {
        const input = document.getElementById('inputCancionArtista');
        if (!input.value.trim()) { alert("Ingresa canción y artista."); return; }
        document.getElementById('modalCancionPreview').innerText = `Obra: "${input.value.trim()}"`;
        document.querySelectorAll('.chk-dia').forEach(chk => chk.checked = false);
        document.getElementById('modalDias').style.display = 'flex';
    }

    window.cerrarModalDias = function() { document.getElementById('modalDias').style.display = 'none'; }

    window.guardarNuevaCancionConDias = async function() {
        const input = document.getElementById('inputCancionArtista');
        const textoTitulo = input.value.trim();
        const diasSeleccionados = [];
        document.querySelectorAll('.chk-dia:checked').forEach(chk => diasSeleccionados.push(chk.value));

        const nuevaObra = {
            texto: textoTitulo,
            bpm: 120,
            dificultad: "Media",
            pistas: "No",
            urgencia: "Media",
            nota: "",
            dias: diasSeleccionados
        };

        datosApp.bandas[datosApp.bandaActiva].canciones.push(nuevaObra);
        guardarEstadoAutomatico();
        input.value = '';
        cerrarModalDias();
        renderizarApp();

        // Integración con GitHub DB estructurada
        const idSlug = textoTitulo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '-');
        const jsonEstructuradoDB = {
            id: idSlug,
            titulo: textoTitulo,
            artista: datosApp.bandas[datosApp.bandaActiva].nombre,
            bpm: 120,
            tono: "",
            afinacion: "",
            estructura: [],
            notasGenerales: "",
            metadatos: {
                creadoPor: "Osvaldo Latín",
                fechaCreacion: new Date().toISOString(),
                ultimaModificacion: new Date().toISOString(),
                version: 0
            }
        };

        try {
            await guardarCancionEnGitHub(jsonEstructuradoDB);
            console.log("Sincronizado con GitHub DB.");
        } catch (err) {
            console.error("Error sincronizando con GitHub:", err);
        }
    }

    window.abrirModalNotas = function(index) {
        indiceCancionEditandoNota = index;
        const cancion = datosApp.bandas[datosApp.bandaActiva].canciones[index];
        document.getElementById('modalNotasTitulo').innerText = `Obra: ${cancion.texto}`;
        document.getElementById('txtNotaPopup').value = cancion.nota || '';
        document.getElementById('modalNotas').style.display = 'flex';
    }

    window.cerrarModalNotas = function() {
        document.getElementById('modalNotas').style.display = 'none';
        indiceCancionEditandoNota = null;
    }

    window.guardarNotaPopup = function() {
        if (indiceCancionEditandoNota !== null) {
            datosApp.bandas[datosApp.bandaActiva].canciones[indiceCancionEditandoNota].nota = document.getElementById('txtNotaPopup').value.trim();
            guardarEstadoAutomatico();
            renderizarApp();
        }
        cerrarModalNotas();
    }

    window.actualizarDato = function(index, campo, valor) {
        datosApp.bandas[datosApp.bandaActiva].canciones[index][campo] = valor;
        guardarEstadoAutomatico();
    }

    window.toggleDiaCancion = function(indexCancion, dia) {
        if (!modoEdicionActivo) return;
        let dias = datosApp.bandas[datosApp.bandaActiva].canciones[indexCancion].dias || [];
        const pos = dias.indexOf(dia);
        if (pos > -1) dias.splice(pos, 1);
        else dias.push(dia);
        guardarEstadoAutomatico();
        renderizarApp();
    }

    window.eliminarCancion = function(index) {
        if (!modoEdicionActivo) return;
        if (confirm("¿Eliminar canción del repertorio?")) {
            datosApp.bandas[datosApp.bandaActiva].canciones.splice(index, 1);
            guardarEstadoAutomatico();
            renderizarApp();
        }
    }

    function crearNuevaBanda() {
        const nombre = prompt("Nombre de la nueva banda o proyecto musical:");
        if (nombre && nombre.trim() !== "") {
            datosApp.bandas.push({ nombre: nombre.trim().toUpperCase(), canciones: [] });
            datosApp.bandaActiva = datosApp.bandas.length - 1;
            guardarEstadoAutomatico();
            renderizarApp();
        }
    }

    window.eliminarBandaActiva = function() {
        if (!modoEdicionActivo) {
            alert("Activa el 'Modo Edición: ON' para poder eliminar bandas.");
            return;
        }
        if (datosApp.bandas.length <= 1) { alert("Debe haber al menos una banda activa."); return; }
        if (confirm("¿Estás seguro de eliminar esta banda por completo?")) {
            datosApp.bandas.splice(datosApp.bandaActiva, 1);
            datosApp.bandaActiva = 0;
            guardarEstadoAutomatico();
            renderizarApp();
        }
    }

    cargarEstado();
</script>
</body>
</html>
